# gitleaks (checks.yml, job Secrets): its default rules on a pull request's commits. The check reads this file as the
# fork's branch has it, so a change here is a pull request of its own and counts from the next one; gitleaks:allow
# comments are not taken. Upstream's commits brought in by a merge are not scanned (FORK.md).
#
# A false finding, say a test's throwaway key, goes to an allowlist here, with where the key comes from, for example:
#
# [[allowlists]]
# description = "the throwaway keys of a test, generated for it"
# paths = ['''^internal/[a-z]+/testdata/''']

title = "arngory/Xray-core"

[extend]
useDefault = true
